        elements:
          -
            content: "Videos are large files that use up a lot of server resources. To lighten the bandwidth on your server, use a video platform like YouTube or Vimeo to serve your videos on the website. Embedding videos on your website allows you to use the video platform’s world-class servers and video optimising function.\r\n\r\nYouTube is also a powerful ally for SEO, which is another benefit of adding your videos to the platform. However, school networks sometimes block YouTube, so embedding Vimeo videos may be a better option.\r\n\r\nIf you must upload a video file, optimise the video before you upload it to avoid performance issues like the user having to wait a long time for the video to load."
